# Copy to fda.toml and change what you need. Every setting and its default is in fda/config.py.
# The API key goes in .env (QWEN_API_KEY=...), never here.

voice = "ryan"            # aiden, dylan, eric, ono_anna, ryan, serena, sohee, uncle_fu, vivian
location = "Quezon City"  # for the weather

# Audio devices: a part of the name from `python -m fda devices` (None/omitted = system default)
# input_device = "USB"
# output_device = "USB"

# aec = false             # turn off FDA's echo canceller if Windows already cancels echo on this mic

# Turn taking (seconds)
# endpoint_silence_s = 0.50
# bargein_confirm_s = 1.50

# Debug: keep mic / reference / echo-cancelled WAVs to tune echo cancellation
# record_dir = "recordings"

# Groq is the main provider (GROQ_API_KEY=... in .env, https://console.groq.com/keys). Each part has one main
# model and ONE fallback, used only when the main one fails.
# Who writes the apps and games FDA builds by voice: "groq" (qwen3.8-27b, fallback gpt-oss-120b; a game in ~5-10 s)
# | "local" (Qwen2.5-Coder-3B, offline, weak at games). Without the key FDA uses the local coder.
coder_engine = "groq"

# Who talks (the agent): "groq" (gpt-oss-120b, ~0.5 s; fallback gpt-oss-20b)
# | "local" (Qwen2.5-3B on this machine, offline, 3-6 s)
llm_engine = "groq"

# Speech: the engine named here, and the offline one below as its fallback (the list always ends offline;
# naming two engines here would add a second fallback).
#   Listening (asr_engine): dgx3 (school Qwen2-Audio, VPN) | groq (Whisper large-v3-turbo, GROQ_API_KEY)
#                           | moonshine | moonshine-tiny | parakeet | parakeet-small   (offline, on this machine)
#   Voice (tts_engine):     dgx3 (school Qwen3-TTS, VPN) | deepgram (DEEPGRAM_API_KEY) | kokoro | piper (offline)
# Examples: asr_engine = "groq,dgx3,moonshine"     tts_engine = "dgx3,kokoro,piper"
#           Pi offline only: asr_engine = "parakeet-small"   tts_engine = "piper"
asr_engine = "groq"   # Groq Whisper; its one fallback is offline_asr (Moonshine, on the device)
tts_engine = "piper"  # Piper on the device (the final Pi setup); "dgx3" = school Qwen3-TTS (campus network or VPN)
offline_asr = "moonshine-base"   # the offline end of the listening chain: moonshine-base | parakeet-small | parakeet
offline_tts = "piper"            # the offline end of the voice chain: piper (Pi) | kokoro (laptop, nicer)
