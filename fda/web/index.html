<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elkit</title>
<style>
  :root { --bg:#0b0d12; --panel:#12161e; --line:#222a36; --text:#e8ecf2; --muted:#7c8696; --accent:#7aa2ff; --accent2:#b07aff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: grid; grid-template-columns: minmax(220px, 32%) minmax(0, 1fr); gap: 16px; padding: 16px; overflow: hidden; }
  /* ---- left: the voice ---- */
  #voice { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; position: relative; }
  #pulse { position: relative; width: 180px; height: 180px; }
  #pulse .core { position: absolute; inset: 50px; border-radius: 50%;
                 background: radial-gradient(circle at 35% 35%, #c9d8ff, var(--accent) 45%, var(--accent2));
                 transition: transform .08s linear, opacity .3s; opacity: .55; }
  #pulse .ring { position: absolute; inset: 50px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; }
  body[data-s="speaking"] #pulse .core { opacity: 1; }
  body[data-s="speaking"] #pulse .ring { animation: ripple 1.6s ease-out infinite; }
  body[data-s="speaking"] #pulse .ring:nth-child(3) { animation-delay: .53s; }
  body[data-s="speaking"] #pulse .ring:nth-child(4) { animation-delay: 1.06s; }
  body[data-s="thinking"] #pulse .core { animation: breathe 1.2s ease-in-out infinite; opacity: .8; }
  /* quiet tells: present (slow idle breath), hearing you (halo follows your voice), got it (a ring pulled in),
     heard but not for me (a faint grey one), thinking (a small dot circling) */
  #pulse { --hear: 0; }
  /* your voice, small, under the name: flat and faint at rest, bars while you talk, a green glow when your words
     were understood (grey: heard, but not for Elkit) */
  #wave { width: 150px; height: 26px; margin-top: -18px; opacity: .35; transition: opacity .4s; display: block; }
  body.hear #wave, #wave.got, #wave.skip { opacity: .85; }
  body[data-s="listening"] #pulse .core { animation: idle 7s ease-in-out infinite; }
  #pulse .core { box-shadow: 0 0 calc(var(--hear) * 46px) calc(var(--hear) * 6px) rgba(122,162,255, calc(var(--hear) * .55)); }
  body.hear #pulse .core { opacity: calc(.6 + var(--hear) * .35); }
  #pulse .catch { position: absolute; inset: 50px; border-radius: 50%; border: 1.5px solid #c9d8ff; opacity: 0; pointer-events: none; }
  #pulse .catch.got { animation: absorb .7s ease-in forwards; }
  #pulse .catch.skip { border-color: var(--muted); animation: absorb-faint .6s ease-in forwards; }
  #pulse .orbit { position: absolute; inset: 38px; border-radius: 50%; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #pulse .orbit i { position: absolute; top: -3px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%;
                    background: #c9d8ff; box-shadow: 0 0 8px 2px rgba(176,122,255,.6); }
  body[data-s="thinking"] #pulse .orbit { opacity: .9; animation: spin 1.3s linear infinite; }
  @keyframes idle { 0%, 100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.035); opacity: .62; } }
  @keyframes absorb { from { transform: scale(1.9); opacity: 0; } 35% { opacity: .55; } to { transform: scale(1); opacity: 0; } }
  @keyframes absorb-faint { from { transform: scale(1.5); opacity: 0; } 40% { opacity: .25; } to { transform: scale(1); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  body[data-s="offline"] #pulse .core { opacity: .15; filter: grayscale(1); }
  @keyframes ripple { from { transform: scale(1); opacity: .6; } to { transform: scale(2.3); opacity: 0; } }
  @keyframes breathe { 50% { transform: scale(1.08); } }
  #name { font-size: 22px; font-weight: 600; letter-spacing: .04em; }
  #conn { position: absolute; bottom: 0; left: 0; width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; }
  #conn.off { background: #ff5d5d; }
  /* ---- right: what is being made ---- */
  #stage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
  #bar { position: absolute; top: 0; left: 0; height: 3px; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2));
         transition: width .4s ease, opacity .4s; z-index: 3; opacity: 0; }
  #bar.on { opacity: 1; }
  #bar.wait { width: 30% !important; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; transition: opacity .3s, filter .3s; }
  iframe.updating { opacity: .45; filter: blur(1px); }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 16px; text-align: center; padding: 24px; }
  /* `display: flex` above beats the hidden attribute: without this the empty box stays over the app and eats every click and scroll */
  #empty[hidden] { display: none; }
  #bar, #note { pointer-events: none; }   /* overlays on the app must never block it */
  #note { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 3; background: rgba(10,12,18,.82);
          border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--text);
          white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .3s; }
  #note.on { opacity: 1; }
  /* ---- Interface sub-tabs: one per app, game, video, photo set or search (switch by voice: "go to the snake tab") ---- */
  #sub { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-height: 28px; }
  #sub::-webkit-scrollbar { display: none; }
  #sub[hidden] { display: none; }
  #sub button { flex: none; display: flex; align-items: center; gap: 6px; background: #141922; color: var(--muted);
                border: 1px solid var(--line); border-radius: 8px; padding: 4px 11px 4px 9px; font: inherit; font-size: 12.5px;
                white-space: nowrap; cursor: pointer; transition: color .2s, border-color .2s, background .2s; }
  #sub button::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--kc); }
  #sub button.on { color: var(--text); border-color: var(--kc); background: #1a2030; }
  #sub .k-site { --kc: #7aa2ff; } #sub .k-app { --kc: #b07aff; } #sub .k-game { --kc: #3ddc84; }
  #sub .k-video { --kc: #ff5d5d; } #sub .k-photos { --kc: #ffcf5c; } #sub .k-links { --kc: #4de1ff; }
  #views { position: absolute; inset: 0; z-index: 1; }
  #views:empty { pointer-events: none; }
  .view { position: absolute; inset: 0; animation: fadein .25s ease-out; }
  .view[hidden] { display: none; }
  .view.video, .view.photos { background: #05070b; }
  .view.video iframe { background: #000; }
  .view.photos img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .view.photos .cap { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; gap: 10px;
                      padding: 18px 12px 8px; font-size: 12px; color: #c9d1dc; background: linear-gradient(transparent, rgba(0,0,0,.75)); }
  .view.photos .cap span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .view.links { overflow-y: auto; padding: 14px 14px 18px; background: var(--panel); }
  .view.links h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .view.links ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .view.links a { display: block; padding: 10px 12px; border-radius: 10px; color: var(--text); text-decoration: none;
                  background: #151a24; border: 1px solid var(--line); }
  .view.links a b { display: block; font-size: 14.5px; font-weight: 600; }
  .view.links a small { display: block; color: var(--accent); font-size: 12px; margin-top: 2px; }
  .view.links a span { display: block; color: var(--muted); font-size: 12.5px; margin-top: 4px; line-height: 1.35; }
  .view.links .n { color: var(--accent); font-weight: 700; margin-right: 6px; }
  .view.links .sum { max-width: 760px; margin: 0 auto; padding: 18px 10px 10px; }
  .view.links .sum .q { font: 600 12px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .view.links .sum h2 { margin: 6px 0 14px; font: 750 26px/1.2 system-ui, sans-serif; color: var(--text); }
  .view.links .sum .lead { font: 450 17px/1.55 system-ui, sans-serif; color: var(--text); margin: 0 0 18px;
                           padding: 14px 16px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 9%, transparent);
                           border-left: 4px solid var(--accent); }
  .view.links .sum h5 { margin: 0 0 10px; font: 650 13px system-ui, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
  .view.links .sum ol { margin: 0; padding: 0; list-style: none; counter-reset: k; display: flex; flex-direction: column; gap: 10px; }
  .view.links .sum li { counter-increment: k; display: flex; gap: 12px; align-items: flex-start; font: 450 15.5px/1.45 system-ui, sans-serif; color: var(--text); }
  .view.links .sum li::before { content: counter(k); flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
                                background: var(--accent); color: #0b0d12; font: 700 12.5px system-ui, sans-serif; margin-top: 1px; }
  .view.links .sum .src { margin-top: 20px; font: 500 12.5px system-ui, sans-serif; color: var(--muted); }
  .view.links .sum .wait { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .view.links .sum .wait i { display: block; height: 14px; border-radius: 7px; background: linear-gradient(90deg, #ffffff10, #ffffff22, #ffffff10);
                             background-size: 200% 100%; animation: sumwait 1.2s linear infinite; }
  .view.links .sum .wait i:nth-child(2) { width: 88%; } .view.links .sum .wait i:nth-child(3) { width: 72%; }
  @keyframes sumwait { from { background-position: 200% 0; } to { background-position: 0 0; } }
  @keyframes fadein { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(12px); opacity: 0; } }
  /* ---- three tabs: Interface (games, websites, videos, links, photos), Virtual Home (the room),
     Virtual Office (slides, documents, spreadsheets) ---- */
  #sub button[hidden] { display: none; }
  #lists { height: 100%; overflow: hidden; font: 600 10.5px/1.35 system-ui, sans-serif; color: #2b3344; }
  #lists h5 { margin: 0 0 2px; font: 800 10px system-ui, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: #6a5a2a; }
  #lists ul { margin: 0 0 4px; padding-left: 13px; }
  #lists li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #lists .none { color: #9a8f74; margin-top: 30px; text-align: center; }
  #right { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
  #tabs { display: flex; gap: 6px; }
  #tabs[hidden] { display: none; }
  #tabs button { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
                 padding: 5px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  #tabs button.on { color: var(--text); border-color: var(--accent); background: rgba(122,162,255,.12); }
  #stage { flex: 1; }
  #stage[hidden] { display: none; }
  #room { flex: 1; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
          display: flex; align-items: center; justify-content: center; }
  #scene { width: 100%; height: 100%; display: block; }
  #scene rect, #scene circle, #scene path, #scene ellipse, #scene stop { transition: fill .7s, opacity .7s, stroke .7s, stroke-dasharray .7s, stop-color .7s; }
  #scene .lbl { font: 600 13px system-ui, sans-serif; fill: #8f99aa; }
  #scene .val { font: 700 20px system-ui, sans-serif; fill: #e8ecf2; font-variant-numeric: tabular-nums; }
  #scene .val.small { font-size: 15px; }
  #scene .sub { font: 600 9px system-ui, sans-serif; fill: #7c8696; letter-spacing: .04em; text-transform: uppercase; }
  #waves { opacity: 0; transition: opacity .5s; }
  #waves.on { opacity: 1; }
  #waves.on path { animation: wave 1.4s ease-out infinite; }
  #waves.on path:nth-child(2) { animation-delay: .2s; }
  #waves.on path:nth-child(3) { animation-delay: .4s; }
  @keyframes wave { 0% { opacity: .15; } 30% { opacity: 1; } 100% { opacity: .15; } }
  #notes { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; height: 100%; }
  #notes .note { width: 63px; height: 50px; padding: 5px 6px; font: 600 10.5px/1.2 system-ui, sans-serif; color: #3a2f10; border-radius: 2px;
                 box-shadow: 0 2px 4px rgba(0,0,0,.35); overflow: hidden; }
  #notes .note span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #notes .note small + span { -webkit-line-clamp: 2; }
  #notes .note:nth-child(1) { background: #ffe58a; transform: rotate(-2.5deg); }
  #notes .note:nth-child(2) { background: #a8e6ff; transform: rotate(2deg); }
  #notes .note:nth-child(3) { background: #ffc2d1; transform: rotate(1.5deg); }
  #notes .note:nth-child(4) { background: #c4f5b0; transform: rotate(-1.5deg); }
  #notes .none { color: #b8a58f; font: 600 11px system-ui, sans-serif; margin: auto; }
  #notes .note small { display: block; font-weight: 700; opacity: .7; }
  #room[hidden] { display: none; }
  #room:not([hidden]), #stage:not([hidden]) { animation: fadein .35s ease-out; }   /* a smooth tab change */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex;
          flex-direction: column; gap: 8px; min-width: 0; }
  .card h3 { margin: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .big { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .card button { background: #1c2230; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
                 padding: 6px 12px; font: inherit; cursor: pointer; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .lamp { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .bulb { width: 46px; height: 46px; border-radius: 50%; flex: none; transition: all .4s; border: 2px solid #333; background: #20262e; }
  .list { margin: 0; padding: 0; list-style: none; font-size: 14px; display: flex; flex-direction: column; gap: 3px; }
  .list li { display: flex; justify-content: space-between; gap: 8px; }
  .muted { color: var(--muted); }
  #ring { position: fixed; inset: 0; background: rgba(13,17,23,.92); display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 18px; z-index: 9; animation: flash 1.2s ease-in-out infinite; }
  #ring[hidden] { display: none; }
  /* ringing: no full-screen overlay (RING_OVERLAY off); the timer clock wiggles and pulses red instead */
  #clock.ringing { animation: wiggle .45s ease-in-out infinite; }
  @keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
  #clock.ringing #tmArc { stroke: #ff5a52 !important; stroke-dasharray: 100 0 !important; opacity: 1 !important;
                          animation: ringglow .45s ease-in-out infinite alternate; }
  @keyframes ringglow { from { stroke-width: 4; filter: none; } to { stroke-width: 8; filter: drop-shadow(0 0 6px #ff5a52); } }
  #ringStop { display: none; cursor: pointer; }
  /* the pretend phone (Virtual Home): a small phone on the side table; its screen comes up for a call or a text */
  #room { position: relative; }
  #phoneSmall.on .scr { fill: #7aa2ff; } #phoneSmall.ring { animation: phwiggle .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes phwiggle { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  #phone { position: absolute; right: 4%; top: 50%; width: 214px; height: 400px; margin-top: -200px; border-radius: 34px;
           background: #0d1017; border: 3px solid #2e3647; box-shadow: 0 18px 50px rgba(0,0,0,.55), inset 0 0 0 6px #151a24;
           padding: 30px 16px 18px; display: flex; flex-direction: column; align-items: center; text-align: center; color: #e8ecf2;
           transition: transform .45s cubic-bezier(.2,.9,.3,1.2), opacity .35s; transform: translateY(0); }
  #phone[hidden] { display: flex; opacity: 0; transform: translateY(40px) scale(.96); pointer-events: none; }
  #phone::before { content: ""; position: absolute; top: 12px; left: 50%; width: 56px; height: 7px; margin-left: -28px; border-radius: 4px; background: #232a38; }
  #phone .who { font: 700 22px system-ui, sans-serif; margin-top: 10px; }
  #phone .num { font: 500 12.5px system-ui, sans-serif; color: var(--muted); margin-top: 3px; letter-spacing: .3px; }
  #phone .st { font: 600 14px system-ui, sans-serif; color: var(--muted); margin-top: 14px; min-height: 20px; }
  #phone .st.bad { color: #ff6b62; }
  #phone .clock { font: 600 15px ui-monospace, monospace; color: #c6cede; margin-top: 4px; min-height: 20px; }
  #phone .av { width: 82px; height: 82px; border-radius: 50%; margin-top: 18px; display: grid; place-items: center; position: relative;
               background: linear-gradient(135deg, #ffb0c8, #b07aff); font: 800 34px system-ui, sans-serif; color: #fff; }
  #phone .av.dad { background: linear-gradient(135deg, #8fd3ff, #7aa2ff); }
  #phone .av.sis, #phone .mini.sis { background: linear-gradient(135deg, #ffb3d1, #e879b9); }
  #phone .av.bro, #phone .mini.bro { background: linear-gradient(135deg, #9be8b4, #3fbf7f); }
  #phone .people { width: 100%; margin-top: 18px; display: flex; flex-direction: column; gap: 9px; }
  #phone .people button { display: flex; gap: 9px; align-items: center; text-align: left; padding: 9px 10px; border-radius: 14px;
                          border: 1px solid #2e3647; background: #151a24; color: #e8ecf2; font: 600 15px system-ui, sans-serif; cursor: pointer; }
  #phone .people b { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #0b0d12; display: grid;
                     place-items: center; font-size: 12px; flex: none; }
  #phone .mini { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #0b0d12;
                 font: 700 16px system-ui, sans-serif; background: linear-gradient(135deg, #ffb0c8, #b07aff); }
  #phone .av { flex: none; } #phone.compose .av, #phone.sent .av { width: 56px; height: 56px; font-size: 24px; margin-top: 8px; }
  #phone .av i { position: absolute; inset: -6px; border-radius: 50%; border: 2px solid #7aa2ff; opacity: 0; }
  #phone.calling .av i { animation: phring 1.6s ease-out infinite; } #phone.calling .av i + i { animation-delay: .8s; }
  @keyframes phring { from { inset: -4px; opacity: .8; } to { inset: -30px; opacity: 0; } }
  #phone .end { margin-top: auto; width: 58px; height: 58px; border-radius: 50%; border: 0; background: #e5484d; color: #fff;
                display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 18px rgba(229,72,77,.4); }
  #phone .end svg { width: 26px; height: 26px; transform: rotate(135deg); }
  #phone .thread { width: 100%; margin-top: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  #phone .bubble { max-width: 88%; padding: 9px 12px; border-radius: 16px 16px 4px 16px; background: #3b6cf6; color: #fff;
                   font: 500 14px/1.3 system-ui, sans-serif; text-align: left; animation: phpop .35s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes phpop { from { transform: translateY(10px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  #phone .dlv { font: 600 11.5px system-ui, sans-serif; color: #7ee2a8; }
  #phone .quick { width: 100%; margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  #phone .quick button { display: flex; gap: 8px; align-items: center; text-align: left; padding: 8px 10px; border-radius: 12px;
                         border: 1px solid #2e3647; background: #151a24; color: #e8ecf2; font: 500 13.5px system-ui, sans-serif; cursor: pointer; }
  #phone .quick b { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #0b0d12; display: grid; place-items: center;
                    font: 800 11.5px system-ui, sans-serif; flex: none; }
  #phone .hint { font: 500 12.5px system-ui, sans-serif; color: var(--muted); margin-top: 12px; }
  #ringStop.on { display: inline; }
  /* live view (tests/pc_watch.py): what the scripted person says and what Elkit answers; hidden normally */
  #demo { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; flex-direction: column; gap: 8px; padding: 0 6px; }
  #demo[hidden] { display: none; }
  #demo .scene { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: center; }
  #demo .line { font-size: 14px; line-height: 1.35; padding: 8px 10px; border-radius: 10px; background: var(--panel);
                border: 1px solid var(--line); min-height: 20px; }
  #demo .line b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
  #demo .you b { color: #ffcf5c; } #demo .bot b { color: var(--accent); }
  #demo .line:empty, #demo .line.none { display: none; }
  /* the pick pop-up: 4 numbered choices ("show me other birds", colour schemes before a website) */
  #choices { position: absolute; inset: 0; z-index: 6; background: rgba(8,10,15,.97); display: flex; flex-direction: column;
             align-items: center; justify-content: center; gap: 14px; padding: 18px; animation: chIn .25s ease-out; }
  #choices[hidden] { display: none; }
  #chTitle { margin: 0; font-size: 22px; font-weight: 600; }
  #chGrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; width: 100%; max-width: 900px; }
  .ch { position: relative; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 12px 10px 10px;
        cursor: pointer; text-align: center; color: var(--text); font: inherit; }
  .ch:hover, .ch.on { border-color: var(--accent); }

window.addEventListener("message", e => {

  let d; try { d = typeof e.data === "string" ? JSON.parse(e.data) : e.data; } catch (err) { return; }

  const st = typeof d.info === "number" ? d.info : d.info.playerState;

function appNav(m){

  if (!doc || !doc.body) return {ok:false, did:"no app is on the screen"};
  tab(tabOf((views.get(activeId) || {}).data));

    const heads = [...doc.querySelectorAll("h1,h2,h3")].filter(seen).map(h => h.innerText.trim()).filter(Boolean).slice(0, 10);
    return {ok:true, did:"looked", title: doc.title, headings: heads, can_click: options(doc),

  }

    if (!el) return {ok:false, did:"no field called " + want, fields: [...doc.querySelectorAll(FIELDS)].filter(seen).map(nameOf).slice(0, 12)};
    if (!setValue(el, m.text || "")) return {ok:false, did:"could not choose " + m.text};
    el.scrollIntoView({block:"center", behavior:"smooth"}); flash(el);
    return {ok:true, did:`typed into ${nameOf(el) || "the field"}`};
  }
  if (!want) return {ok:false, did:"say what to " + (act === "click" ? "click" : "go to"), can_click: options(doc)};
  // go_to / click: a link, tab or button by its name; go_to also finds a section by its heading or id
  const el = best(doc, CLICKABLE, want, e => e.getAttribute("href") || e.dataset.tab || e.dataset.target || "");
  if (el){
    const href = el.getAttribute("href") || "";
    const sec = href.startsWith("#") && href.length > 1 ? doc.getElementById(decodeURIComponent(href.slice(1))) : null;

  }

}

const COLORS = {"warm white":"#ffc477","cool white":"#a9ccff","white":"#f4f1ea","neutral white":"#f4f1ea","red":"#ff4d4d",
  "green":"#3ddc84","blue":"#4d8bff","yellow":"#ffe14d","orange":"#ff9f40","purple":"#a66bff","pink":"#ff7ac6","cyan":"#4de1ff",
  "magenta":"#ff4dff","violet":"#9a6bff","teal":"#2bc4b4"};
// what people (and the LLM) call the two tones: "cool", "cold", "daylight", "warm tone", "soft white", "candle"...
function lightColor(name){
  const n = String(name || "").toLowerCase().trim();
  if (COLORS[n]) return COLORS[n];
  if (/^#[0-9a-f]{6}$/i.test(n)) return n;
  if (/\b(cool|cold|cooler|colder|daylight|day light|icy|ice|bluish|crisp)\b/.test(n)) return COLORS["cool white"];
  if (/\b(warm|warmer|soft|candle|candlelight|cozy|cosy|amber|sunset|yellowish)\b/.test(n)) return COLORS["warm white"];
  if (/\bneutral|natural|plain\b/.test(n)) return COLORS["neutral white"];
  for (const k of Object.keys(COLORS)) if (new RegExp("\\b" + k + "\\b").test(n)) return COLORS[k];   // "light blue" -> blue
  try {                                         // any other CSS colour name ("lavender", "gold")
    const cx = document.createElement("canvas").getContext("2d"); cx.fillStyle = "#000001"; cx.fillStyle = n;
    if (cx.fillStyle !== "#000001") return cx.fillStyle;
  } catch (e) {}
  return COLORS["warm white"];
}

let phoneKey = "", phoneSince = 0, phoneState = "idle";
function phEsc(t){ const d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; }
function avc(n){ return /^sister$/i.test(n) ? " sis" : /^brother$/i.test(n) ? " bro" : /^daddy$/i.test(n) ? " dad" : ""; }
function drawPhone(p){
  const P = $("phone"), st = p.state || "idle", on = st !== "idle";
  $("phoneSmall").classList.toggle("on", on); $("phoneSmall").classList.toggle("ring", st === "calling");
  phoneState = st; phoneSince = (p.since || 0) * 1000;
  const key = JSON.stringify([st, p.contact, p.text, p.since, p.action]);
  if (key === phoneKey) return;
  phoneKey = key;
  if (!on){ P.hidden = true; P.className = ""; return; }
  const who = p.contact || "", ini = (who.trim()[0] || "?").toUpperCase(), dad = "";
  const head = st === "contacts" ? `<div class="who">Contacts</div><div class="num">${p.action === "message" ? "Who to text?" : "Who to call?"}</div>`
    : `<div class="av${dad}${avc(who)}"><i></i><i></i>${phEsc(ini)}</div><div class="who">${phEsc(who)}</div><div class="num">${phEsc(p.number || "")}</div>`;
  let body = "";
  if (st === "contacts") body = `<div class="people">` + (p.contacts || []).map((c, i) =>
      `<button data-c="${phEsc(c)}"><b>${i + 1}</b><span class="mini${avc(c)}">${phEsc(c[0])}</span>${phEsc(c)}</button>`).join("") + `</div>`;
  else if (st === "calling") body = `<div class="st">Calling…</div><div class="clock" id="phClock">0:00</div><button class="end" title="End call">${PHONE_SVG}</button>`;
  else if (st === "no answer") body = `<div class="st bad">No answer</div><div class="hint">${phEsc(who)} didn't pick up</div>`;
  else if (st === "ended") body = `<div class="st">Call ended</div>`;
  else if (st === "compose") body = `<div class="hint">What should it say?</div><div class="quick">` +
      (p.quick || []).map((q, i) => `<button data-q="${phEsc(q)}"><b>${i + 1}</b>${phEsc(q)}</button>`).join("") + `</div>`;
  else if (st === "sent") body = `<div class="thread"><div class="bubble">${phEsc(p.text)}</div><div class="dlv">Delivered ✓</div></div>`;
  P.className = st.replace(" ", "-"); P.innerHTML = head + body; P.hidden = false;
  const end = P.querySelector(".end"); if (end) end.onclick = () => act({tool: "end_call"});
  P.querySelectorAll(".people button").forEach(b => b.onclick = () => act({tool: p.action || "call", contact: b.dataset.c, text: ""}));
  P.querySelectorAll(".quick button").forEach(b => b.onclick = () => act({tool: "message", contact: who, text: b.dataset.q}));
  tickPhone();
}
function tickPhone(){
  const c = $("phClock"); if (!c || phoneState !== "calling") return;
  c.textContent = fmt(Math.max(0, Math.floor((Date.now() - phoneSince) / 1000)));
}
setInterval(tickPhone, 500);
$("tDesign").onclick = () => { tab("design", true); pickHere(); };
$("tRoom").onclick = () => tab("room", true);
$("tOffice").onclick = () => { tab("office", true); pickHere(); };
function stopRinging(){ $("ring").hidden = true; ringing = ""; $("clock").classList.remove("ringing");
  $("ringStop").classList.remove("on"); $("alarmTxt").style.display = ""; drawTimer(); act({tool:"stop_ringing"}); }
$("stopRing").onclick = stopRinging;
$("ringStop").addEventListener("click", stopRinging);
function showChoices(m){
  const box = $("choices");
  if (m.close || !m.options || !m.options.length){ box.hidden = true; return; }
  $("chTitle").textContent = m.title || "Pick one";
  const g = $("chGrid"); g.textContent = "";
  for (const o of m.options){
    const b = document.createElement("button"); b.className = "ch";
    const n = document.createElement("span"); n.className = "n"; n.textContent = o.n; b.append(n);
    if (o.img){ const im = new Image(); im.src = o.img; im.alt = o.label; b.append(im); }
    else if (o.colors){                             // a colour scheme: a tiny web page in those colours
      const c = o.colors, mk = document.createElement("div"); mk.className = "mock"; mk.style.background = c.background;
      const hd = document.createElement("div"); hd.className = "hd"; hd.style.background = c.primary;
      const bd = document.createElement("div"); bd.className = "bd";
      const card = document.createElement("div"); card.className = "card"; card.style.background = c.surface; card.style.color = c.text;
      const h = document.createElement("b"); h.style.color = c.primary; h.textContent = "Welcome";
      card.append(h, document.createElement("br"), "Text looks like this");
      const btn = document.createElement("span"); btn.className = "btn"; btn.style.background = c.accent; btn.style.color = c.surface;
      btn.textContent = "Button"; bd.append(card, btn); mk.append(hd, bd); b.append(mk);
    }
    const l = document.createElement("div"); l.className = "lbl"; l.textContent = o.label; b.append(l);
    b.onclick = () => { b.classList.add("on"); if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:"choice", n:o.n})); };
    g.append(b);
  }
  box.hidden = false;
}
function demo(m){                                  // live view captions (only sent by tests/pc_watch.py)
  if (m.off){ $("demo").hidden = true; return; }
  $("demo").hidden = false;
  if (m.scene !== undefined) $("dmScene").textContent = m.scene;
  for (const [k, id] of [["you", "dmYou"], ["bot", "dmBot"]]){
    if (m[k] === undefined) continue;
    const el = $(id); el.querySelector("span").textContent = m[k]; el.classList.toggle("none", !m[k]);
  }
}
function onMsg(m){
  switch (m.type){
    case "demo": demo(m); break;
    case "choices": showChoices(m); break;
    case "hello": if (pageV === null) pageV = m.v; else if (m.v !== pageV) location.reload(); break;
    case "status": setStatus(m.status); break;
    case "level": level(m.db); break;
    case "voice": hear(m.on); waveRun(); break;
    case "mic": mic(m.db); waveMic(m.db); break;
    case "user": caught(!!m.ignored); waveTint(!m.ignored); break;
    case "views": renderViews(m); break;
    case "video_cmd": videoCmd(m); break;
    case "app_nav": { let r; try { r = appNav(m); } catch (e) { r = {ok:false, did:"error: " + e.message}; }
                      if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:"app_result", id:m.id, ...r})); break; }
    case "app_set": { const base = (m.url || "").split("?")[0];
                      const v = [...views.values()].find(x => x.kind === "app" && x.data.url === base) || views.get(activeId);
                      if (v && v.frame) v.frame.contentWindow.postMessage({type:"fda_set", patch:m.patch}, "*"); break; }
    case "build": if (m.building) tab(OFFICE_WORDS.test(m.title || "") ? "office" : "design"); showBuild(m); break;
    case "room": renderRoom(m.state); if (m.state && m.state.ringing) tab("room"); break;
    case "tab": tab(m.tab); break;
  }
}
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => $("conn").classList.remove("off");
  ws.onclose = () => { $("conn").classList.add("off"); setStatus("offline");
                       $("ring").hidden = true;                 // Elkit is gone: nothing can be ringing
                       ringing = ""; $("clock").classList.remove("ringing"); $("ringStop").classList.remove("on");
                       setTimeout(connect, 1500); };
  ws.onmessage = e => { try { onMsg(JSON.parse(e.data)); } catch (err) {} };
}
connect();
</script>
